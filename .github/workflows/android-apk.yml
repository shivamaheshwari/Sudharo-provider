name: Build Sudharo Provider APK

# Local Gradle builds are blocked in the author's VM (daemon loopback),
# so the APK is built here on GitHub Actions and published as a Release.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        run: ./gradle-8.9/bin/gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sudharo-Provider-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: Sudharo Provider v1.0.0 (debug APK)
          body: |
            Debug APK of Sudharo Provider (demo mode — no Supabase keys).
            Signup OTP: 123456 • Job completion OTP: 654321
            Install on Android 8.0+ (API 26+). This is a debug build, not a Play Store release.
          files: android/app/build/outputs/apk/debug/app-debug.apk
